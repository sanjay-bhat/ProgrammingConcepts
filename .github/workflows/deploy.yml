name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - tracker.html
      - .github/workflows/deploy.yml

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; a queued run cancels any in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site/
        run: |
          mkdir -p _site

          # Serve tracker as the root index
          cp tracker.html _site/index.html

          # robots.txt
          printf "User-agent: *\nAllow: /\n" > _site/robots.txt

          # Prevent Jekyll processing
          touch _site/.nojekyll

          echo "Site contents:"
          ls -lh _site/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
