<title>LeetCode Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ── Tokens ── */
:root {
  --bg:           #f1f4f9;
  --surface:      #ffffff;
  --surface-hi:   #eaeff7;
  --border:       #d4dae8;
  --text:         #141d2e;
  --muted:        #5a6a87;
  --accent:       #2563eb;
  --accent-dim:   #dbeafe;

  --easy:         #15803d;  --easy-bg:   #dcfce7;
  --medium:       #b45309;  --medium-bg: #fef3c7;
  --hard:         #dc2626;  --hard-bg:   #fee2e2;

  --chip-1:       #166534;  --chip-1-bg:    #dcfce7;
  --chip-log:     #0e7490;  --chip-log-bg:  #cffafe;
  --chip-n:       #1d4ed8;  --chip-n-bg:    #dbeafe;
  --chip-nlogn:   #6d28d9;  --chip-nlogn-bg:#ede9fe;
  --chip-n2:      #c2410c;  --chip-n2-bg:   #ffedd5;
  --chip-n3:      #9f1239;  --chip-n3-bg:   #ffe4e6;
  --chip-exp:     #7c2d12;  --chip-exp-bg:  #fce7f3;

  --stripe-easy:   #15803d;
  --stripe-medium: #d97706;
  --stripe-hard:   #dc2626;

  --progress-bg:  #e2e8f0;
  --progress-fill:#2563eb;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:           #090e1a;
    --surface:      #111827;
    --surface-hi:   #1a2235;
    --border:       #243050;
    --text:         #e2e8f4;
    --muted:        #7a8faf;
    --accent:       #60a5fa;
    --accent-dim:   #1e3a6e;
    --easy:         #4ade80;  --easy-bg:   #052e16;
    --medium:       #fbbf24;  --medium-bg: #1c0f00;
    --hard:         #f87171;  --hard-bg:   #1c0000;
    --chip-1:       #4ade80;  --chip-1-bg:    #052e16;
    --chip-log:     #22d3ee;  --chip-log-bg:  #0c1f25;
    --chip-n:       #60a5fa;  --chip-n-bg:    #0f1f3d;
    --chip-nlogn:   #a78bfa;  --chip-nlogn-bg:#1e1040;
    --chip-n2:      #fb923c;  --chip-n2-bg:   #2a1200;
    --chip-n3:      #fb7185;  --chip-n3-bg:   #2a0010;
    --chip-exp:     #f0abfc;  --chip-exp-bg:  #2d0040;
    --progress-bg:  #1e2a40;
    --progress-fill:#60a5fa;
  }
}
:root[data-theme="dark"] {
  --bg:           #090e1a;
  --surface:      #111827;
  --surface-hi:   #1a2235;
  --border:       #243050;
  --text:         #e2e8f4;
  --muted:        #7a8faf;
  --accent:       #60a5fa;
  --accent-dim:   #1e3a6e;
  --easy:         #4ade80;  --easy-bg:   #052e16;
  --medium:       #fbbf24;  --medium-bg: #1c0f00;
  --hard:         #f87171;  --hard-bg:   #1c0000;
  --chip-1:       #4ade80;  --chip-1-bg:    #052e16;
  --chip-log:     #22d3ee;  --chip-log-bg:  #0c1f25;
  --chip-n:       #60a5fa;  --chip-n-bg:    #0f1f3d;
  --chip-nlogn:   #a78bfa;  --chip-nlogn-bg:#1e1040;
  --chip-n2:      #fb923c;  --chip-n2-bg:   #2a1200;
  --chip-n3:      #fb7185;  --chip-n3-bg:   #2a0010;
  --chip-exp:     #f0abfc;  --chip-exp-bg:  #2d0040;
  --progress-bg:  #1e2a40;
  --progress-fill:#60a5fa;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13.5px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Filter bar ── */
.filter-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 9px 18px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.filter-bar h1 {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
  margin-right: 2px;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 160px;
  max-width: 280px;
}
.search-wrap svg {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
#search {
  width: 100%;
  padding: 5px 10px 5px 28px;
  background: var(--surface-hi);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  outline: none;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--muted); }

.pill-group { display: flex; gap: 3px; }
.pill {
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
}
.pill:hover { background: var(--surface-hi); color: var(--text); }
.pill.on { background: var(--text); color: var(--bg); border-color: transparent; }
.pill.easy.on   { background: var(--easy);   border-color: transparent; color: #fff; }
.pill.medium.on { background: var(--medium); border-color: transparent; color: #fff; }
.pill.hard.on   { background: var(--hard);   border-color: transparent; color: #fff; }

/* ── Stats strip ── */
.stats-strip {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 6px 18px;
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  font-family: 'IBM Plex Mono', monospace;
}
.stat-item strong {
  color: var(--text);
  font-weight: 500;
}
.progress-outer {
  width: 100px;
  height: 5px;
  background: var(--progress-bg);
  border-radius: 3px;
  overflow: hidden;
}
.progress-inner {
  height: 100%;
  background: var(--progress-fill);
  border-radius: 3px;
  transition: width .3s;
}
.stat-sep { color: var(--border); font-weight: 300; }
.visible-count {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  font-family: 'IBM Plex Mono', monospace;
  white-space: nowrap;
}
.visible-count strong { color: var(--text); }

/* ── Content ── */
.content { padding: 14px 18px 48px; max-width: 1120px; margin: 0 auto; }

/* ── Category section ── */
details.cat { margin-bottom: 8px; }
details.cat[open] summary { border-radius: 6px 6px 0 0; }
summary.cat-hd {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  list-style: none;
  font-weight: 600;
  font-size: 12.5px;
  user-select: none;
  transition: background .12s;
}
summary.cat-hd::-webkit-details-marker { display: none; }
summary.cat-hd:hover { background: var(--surface-hi); }
.chevron {
  width: 13px; height: 13px;
  color: var(--muted);
  transition: transform .18s;
  flex-shrink: 0;
}
details[open] .chevron { transform: rotate(90deg); }
.cat-name { flex: 1; }

.cat-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cat-bar-outer {
  width: 60px;
  height: 4px;
  background: var(--progress-bg);
  border-radius: 2px;
  overflow: hidden;
  flex-shrink: 0;
}
.cat-bar-inner {
  height: 100%;
  background: var(--progress-fill);
  border-radius: 2px;
}
.cat-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
  white-space: nowrap;
}
.cat-count .n-solved { color: var(--accent); font-weight: 500; }

/* ── Table ── */
.tbl-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 6px 6px;
}
table { width: 100%; border-collapse: separate; border-spacing: 0; }
thead tr { background: var(--surface-hi); }
thead th { border-bottom: 1px solid var(--border); }
th {
  padding: 5px 10px;
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--muted);
  text-align: left;
  white-space: nowrap;
}
th.num { width: 44px; text-align: right; }
th.lvl { width: 76px; }
th.cmx { width: 96px; }

tbody tr {
  background: var(--surface);
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), background .1s, box-shadow .22s, opacity .15s;
  position: relative;
  z-index: 0;
}
tbody tr:hover {
  background: var(--surface-hi);
  transform: scaleY(1.06) scaleX(1.005);
  box-shadow: 0 8px 32px rgba(0,0,0,.13), 0 2px 8px rgba(0,0,0,.08);
  z-index: 10;
}
tbody:has(tr:hover) tr:not(:hover):not([hidden]) { opacity: .62; }
tbody tr[hidden] { display: none; }
tbody tr.fav-row td.ttl { border-left-color: #f59e0b !important; }

td { padding: 6px 10px; vertical-align: middle; border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: none; }
td.num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--muted);
  text-align: right;
  padding-right: 6px;
  padding-left: 0;
  font-variant-numeric: tabular-nums;
}
td.ttl {
  padding-left: 0;
  border-left: 3px solid transparent;
}
tr.easy   td.ttl { border-left-color: var(--stripe-easy); }
tr.medium td.ttl { border-left-color: var(--stripe-medium); }
tr.hard   td.ttl { border-left-color: var(--stripe-hard); }

.plink {
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  font-size: 12.5px;
}
.plink:hover { color: var(--accent); text-decoration: underline; }
.plink.unsolved { color: var(--muted); font-weight: 400; }

.ds { font-size: 11.5px; color: var(--muted); max-width: 180px; }

/* ── Chips ── */
.chip {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 3px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.c1    { color: var(--chip-1);    background: var(--chip-1-bg); }
.clog  { color: var(--chip-log);  background: var(--chip-log-bg); }
.cn    { color: var(--chip-n);    background: var(--chip-n-bg); }
.cnl   { color: var(--chip-nlogn);background: var(--chip-nlogn-bg); }
.cn2   { color: var(--chip-n2);   background: var(--chip-n2-bg); }
.cn3   { color: var(--chip-n3);   background: var(--chip-n3-bg); }
.cexp  { color: var(--chip-exp);  background: var(--chip-exp-bg); }

/* ── Badge ── */
.badge {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 3px;
  white-space: nowrap;
}
.be { color: var(--easy);   background: var(--easy-bg); }
.bm { color: var(--medium); background: var(--medium-bg); }
.bh { color: var(--hard);   background: var(--hard-bg); }

/* ── Empty ── */
.empty { text-align:center; padding:28px; color:var(--muted); font-size:13px; display:none; }

/* ── Actions column ── */
th.act-th { width: 52px; }
td.act-col { padding: 4px 6px; white-space: nowrap; }
.fav-btn, .pl-btn {
  background: none; border: none; cursor: pointer; padding: 3px 4px;
  border-radius: 4px; font-size: 14px; line-height: 1;
  color: var(--muted); transition: color .12s, background .12s, transform .15s;
}
.fav-btn:hover { color: #f59e0b; background: rgba(245,158,11,.1); transform: scale(1.2); }
.fav-btn.active { color: #f59e0b; }
.pl-btn { font-size: 16px; font-weight: 600; }
.pl-btn:hover { color: var(--accent); background: var(--accent-dim); transform: scale(1.2); }

/* ── Playlists drawer ── */
.pl-open-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; transition: background .1s;
}
.pl-open-btn:hover { background: var(--surface-hi); }

.pl-drawer {
  position: fixed; top: 0; right: -340px; width: 320px; height: 100vh;
  background: var(--surface); border-left: 1px solid var(--border);
  box-shadow: -8px 0 32px rgba(0,0,0,.12); z-index: 100;
  transition: right .28s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
}
.pl-drawer.open { right: 0; }
.pl-drawer-hd {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 14px;
}
.pl-drawer-close {
  margin-left: auto; background: none; border: none;
  cursor: pointer; font-size: 18px; color: var(--muted); padding: 2px 6px;
  border-radius: 4px;
}
.pl-drawer-close:hover { background: var(--surface-hi); color: var(--text); }
.pl-list { flex: 1; overflow-y: auto; padding: 10px 12px; }
.pl-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: background .1s;
  border: 1px solid transparent; margin-bottom: 4px;
}
.pl-item:hover { background: var(--surface-hi); }
.pl-item.active-pl { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.pl-item .pl-ct { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
.pl-item-del { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 14px; padding: 2px; border-radius: 3px; }
.pl-item-del:hover { color: var(--hard); background: var(--hard-bg); }
.pl-create {
  padding: 10px 12px; border-top: 1px solid var(--border);
  display: flex; gap: 6px;
}
.pl-create input {
  flex: 1; padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-size: 12.5px;
}
.pl-create input:focus { outline: none; border-color: var(--accent); }
.pl-create button {
  padding: 6px 12px; background: var(--accent); color: #fff;
  border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
}

/* ── Playlist popup (add-to-playlist) ── */
.pl-popup {
  position: fixed; z-index: 200; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,.18); padding: 10px 0;
  min-width: 200px; max-width: 260px;
  display: none;
}
.pl-popup.open { display: block; }
.pl-popup-title { padding: 4px 14px 8px; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.pl-popup-item {
  padding: 7px 14px; cursor: pointer; font-size: 12.5px;
  transition: background .08s; display: flex; align-items: center; gap: 8px;
}
.pl-popup-item:hover { background: var(--surface-hi); }
.pl-popup-item.already { color: var(--muted); font-style: italic; }
.pl-popup-divider { height: 1px; background: var(--border); margin: 6px 0; }

/* ── Fav pill active color ── */
#sf .pill[data-s="fav"].on { background: #f59e0b; border-color: #f59e0b; color: #fff; }

/* ── Notebook viewer overlay ── */
.nb-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,.55); backdrop-filter: blur(3px);
  display: none; justify-content: flex-end;
}
.nb-overlay.open { display: flex; }
.nb-panel {
  width: min(96vw, 960px); height: 100vh;
  background: var(--bg); display: flex; flex-direction: column;
  box-shadow: -16px 0 64px rgba(0,0,0,.28);
  animation: nbSlide .24s cubic-bezier(.4,0,.2,1);
}
@keyframes nbSlide { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }

.nb-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0; min-width: 0;
}
.nb-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
.nb-title { font-size: 14px; font-weight: 600; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.nb-badge.be { background: var(--easy-bg); color: var(--easy); }
.nb-badge.bm { background: var(--medium-bg); color: var(--medium); }
.nb-badge.bh { background: var(--hard-bg); color: var(--hard); }
.nb-gh-link { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; padding: 3px 9px; border: 1px solid var(--accent-dim); border-radius: 5px; }
.nb-gh-link:hover { background: var(--accent-dim); }
.nb-close { background: none; border: 1px solid var(--border); cursor: pointer; color: var(--muted); font-size: 15px; padding: 3px 9px; border-radius: 6px; transition: all .12s; white-space: nowrap; flex-shrink: 0; }
.nb-close:hover { background: var(--surface-hi); color: var(--text); }

.nb-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 18px; flex-shrink: 0; overflow-x: auto; }
.nb-tab { background: none; border: none; cursor: pointer; padding: 10px 14px; font-size: 12.5px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; transition: color .1s, border-color .1s; margin-bottom: -1px; white-space: nowrap; font-family: inherit; }
.nb-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.nb-tab:hover:not(.active) { color: var(--text); }

.nb-body { flex: 1; overflow-y: auto; padding: 24px 28px; }
.nb-loading, .nb-error { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13.5px; }
.nb-error a { color: var(--accent); }

.nb-code-wrap { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); position: relative; margin: 4px 0 16px; }
.nb-code-lang { position: absolute; top: 9px; right: 13px; font-size: 10px; font-weight: 600; color: #6e7681; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: .08em; }
pre.nb-code { margin: 0; padding: 18px 20px; overflow-x: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.65; background: #0d1117; color: #e6edf3; }

/* Prism GitHub Dark theme (inlined) */
code[class*="language-"], pre[class*="language-"] { color: #e6edf3; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1.65; }
.token.comment, .token.prolog, .token.cdata { color: #8b949e; font-style: italic; }
.token.punctuation { color: #e6edf3; }
.token.namespace { opacity: .7; }
.token.property, .token.tag, .token.deleted, .token.constant { color: #ff7b72; }
.token.boolean, .token.number { color: #79c0ff; }
.token.string, .token.char, .token.inserted, .token.attr-value { color: #a5d6ff; }
.token.operator { color: #e6edf3; }
.token.keyword, .token.atrule { color: #ff7b72; }
.token.function, .token.class-name { color: #d2a8ff; }
.token.regex, .token.variable { color: #ffa657; }
.token.type-annotation, .token.builtin { color: #79c0ff; }

.nb-md { font-size: 13.5px; line-height: 1.75; color: var(--text); }
.nb-md h1 { font-size: 18px; margin: 0 0 14px; }
.nb-md h2 { font-size: 14.5px; margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.nb-md h3 { font-size: 13px; margin: 14px 0 6px; }
.nb-md table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 10px 0 16px; }
.nb-md th, .nb-md td { padding: 6px 10px; border: 1px solid var(--border); text-align: left; }
.nb-md th { background: var(--surface); font-weight: 600; }
.nb-md code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--surface-hi); padding: 1px 5px; border-radius: 3px; }
.nb-md a { color: var(--accent); }
.nb-md p { margin: 8px 0; }
.nb-md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.nb-md ul, .nb-md ol { padding-left: 20px; margin: 8px 0; }
.nb-md strong { font-weight: 600; }
.nb-md em { font-style: italic; }

/* ── Playlists filter pills ── */
.pl-pills { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.pl-filter-pill {
  padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
  background: var(--surface); border: 1px solid var(--border); cursor: pointer;
  transition: background .1s; color: var(--text);
}
.pl-filter-pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>

<div class="filter-bar">
  <h1>LeetCode</h1>
  <div class="search-wrap">
    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search" type="search" placeholder="Search…" autocomplete="off">
  </div>
  <div class="pill-group" id="df">
    <button class="pill on" data-d="all">All</button>
    <button class="pill easy"   data-d="easy">Easy</button>
    <button class="pill medium" data-d="medium">Medium</button>
    <button class="pill hard"   data-d="hard">Hard</button>
  </div>
  <div class="pill-group" id="sf">
    <button class="pill on" data-s="all">All</button>
    <button class="pill" data-s="1">Solved</button>
    <button class="pill" data-s="0">Unsolved</button>
    <button class="pill" data-s="fav" id="fav-pill">★ Favorites</button>
  </div>
  <button class="pl-open-btn" id="pl-open">📋 Playlists</button>
</div>

<div class="pl-pills" id="pl-filter-row" style="padding:6px 18px 0; display:none;"></div>

<!-- Playlists drawer -->
<aside class="pl-drawer" id="pl-drawer">
  <div class="pl-drawer-hd">
    📋 Playlists
    <button class="pl-drawer-close" id="pl-close">✕</button>
  </div>
  <div class="pl-list" id="pl-list"></div>
  <div class="pl-create">
    <input id="pl-new-name" placeholder="New playlist name…" maxlength="40">
    <button id="pl-create-btn">Create</button>
  </div>
</aside>

<!-- Add-to-playlist popup -->
<div class="pl-popup" id="pl-popup">
  <div class="pl-popup-title">Add to playlist</div>
  <div id="pl-popup-body"></div>
</div>

<div class="stats-strip" id="stats-strip">
  <div class="stat-item">
    <strong id="st-solved">—</strong><span>solved</span>
    <span class="stat-sep">/</span>
    <strong id="st-total">—</strong>
    <div class="progress-outer"><div class="progress-inner" id="st-bar" style="width:0%"></div></div>
    <strong id="st-pct">—</strong>
  </div>
  <div class="stat-item"><span class="chip be" id="st-easy">—</span></div>
  <div class="stat-item"><span class="chip bm" id="st-med">—</span></div>
  <div class="stat-item"><span class="chip bh" id="st-hard">—</span></div>
  <div class="visible-count" id="vis-count"><strong>—</strong> shown</div>
</div>

<div class="content" id="content"></div>
<p class="empty" id="empty">No problems match your filters.</p>

// ── chip helpers ──
const chipCls = {1:'c1',logn:'clog',n:'cn',nlogn:'cnl',n2:'cn2',n3:'cn3',exp:'cexp'};
const chipLbl = {1:'O(1)',logn:'O(log n)',n:'O(n)',nlogn:'O(n log n)',n2:'O(n²)',n3:'O(n³)',exp:'O(2ⁿ)'};
function chip(k) {
  const cls = chipCls[k] || 'cn';
  const lbl = chipLbl[k] || `O(${k})`;
  return `<span class="chip ${cls}">${lbl}</span>`;
}

// ── Favorites + Playlists (localStorage) ──
const FAV_KEY = 'lc_favs';
const PL_KEY  = 'lc_playlists';

function loadFavs() {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)||'[]')); } catch { return new Set(); }
}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch {}
}
function loadPlaylists() {
  try { return JSON.parse(localStorage.getItem(PL_KEY)||'{}'); } catch { return {}; }
}
function savePlaylists() {
  try { localStorage.setItem(PL_KEY, JSON.stringify(playlists)); } catch {}
}

let favs     = loadFavs();
let playlists = loadPlaylists(); // { name: [n, n, ...] }

// ── global stats ──
const uniq = new Set();
P.forEach(p => uniq.add(p.n));
const allUniq = [...uniq];
const solvedSet = new Set(P.filter(x=>x.s).map(x=>x.n));
const totalUniq = allUniq.length;
const solvedUniq = solvedSet.size;

// Difficulty stats (unique problems)
const diffSolved = {easy:0,medium:0,hard:0};
const diffTotal  = {easy:0,medium:0,hard:0};
const seenDiff = {};
P.forEach(p => {
  if (!seenDiff[p.n]) {
    seenDiff[p.n] = true;
    diffTotal[p.d] = (diffTotal[p.d]||0) + 1;
    if (p.s) diffSolved[p.d] = (diffSolved[p.d]||0) + 1;
  }
});

document.getElementById('st-solved').textContent = solvedUniq;
document.getElementById('st-total').textContent  = totalUniq;
document.getElementById('st-pct').textContent    = Math.round(solvedUniq/totalUniq*100) + '%';
document.getElementById('st-bar').style.width    = (solvedUniq/totalUniq*100) + '%';
document.getElementById('st-easy').textContent   = `Easy ${diffSolved.easy}/${diffTotal.easy}`;
document.getElementById('st-med').textContent    = `Med ${diffSolved.medium}/${diffTotal.medium}`;
document.getElementById('st-hard').textContent   = `Hard ${diffSolved.hard}/${diffTotal.hard}`;

// ── group by category ──
const cats = {};

const content = document.getElementById('content');

Object.entries(cats).forEach(([cat, probs]) => {

  const pct    = Math.round(solved/total*100);

  const det = document.createElement('details');
  det.className = 'cat';
  det.open = true;

  const rows = probs.map(p => {

      ? `${ghBase}${nb}.ipynb`

    const isFav = favs.has(p.n);
    return `<tr class="${p.d}${isFav?' fav-row':''}" data-d="${p.d}" data-s="${p.s?'1':'0'}" data-t="${p.t.toLowerCase()}" data-n="${p.n}" data-fav="${isFav?'1':'0'}">
      <td class="num">${p.n}</td>
      <td class="ttl"><a class="plink ${p.s?'':'unsolved'}" href="${href}" target="_blank" rel="noopener">${icon}${p.t}</a></td>
      <td class="ds">${p.ds}</td>
      <td>${chip(p.tc)}</td>
      <td>${chip(p.sc)}</td>

  det.innerHTML = `

      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>

        <tbody>${rows}</tbody>
      </table>
    </div>`;
  content.appendChild(det);
});

// ── filters ──
let activeDiff = 'all', activeStatus = 'all', activePl = null;

function refilter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const plNums = activePl ? new Set(playlists[activePl]||[]) : null;
  let vis = 0;
  document.querySelectorAll('tbody tr').forEach(row => {
    const n = +row.dataset.n;
    const show =
      (!q || row.dataset.t.includes(q)) &&
      (activeDiff === 'all' || row.dataset.d === activeDiff) &&
      (activeStatus === 'all' || activeStatus === 'fav'
        ? (activeStatus === 'fav' ? row.dataset.fav === '1' : true)
        : row.dataset.s === activeStatus) &&
      (!plNums || plNums.has(n));
    row.hidden = !show;
    if (show) vis++;
  });
  document.querySelectorAll('details.cat').forEach(det => {
    const any = det.querySelectorAll('tbody tr:not([hidden])').length > 0;
    det.style.display = any ? '' : 'none';
  });
  document.getElementById('vis-count').innerHTML = `<strong>${vis}</strong> shown`;
  document.getElementById('empty').style.display = vis === 0 ? 'block' : 'none';
}

document.getElementById('search').addEventListener('input', refilter);

document.getElementById('df').addEventListener('click', e => {
  const b = e.target.closest('.pill'); if (!b) return;
  activeDiff = b.dataset.d;
  document.querySelectorAll('#df .pill').forEach(x => x.classList.toggle('on', x===b));
  refilter();
});

document.getElementById('sf').addEventListener('click', e => {
  const b = e.target.closest('.pill'); if (!b) return;
  activeStatus = b.dataset.s;
  document.querySelectorAll('#sf .pill').forEach(x => x.classList.toggle('on', x===b));
  refilter();
});

// ── Fav button clicks ──
document.addEventListener('click', e => {
  const btn = e.target.closest('.fav-btn');
  if (!btn) return;
  const n = +btn.dataset.n;
  const row = btn.closest('tr');
  if (favs.has(n)) {
    favs.delete(n);
    btn.textContent = '☆'; btn.classList.remove('active');
    btn.title = 'Add to favorites';
    row.dataset.fav = '0'; row.classList.remove('fav-row');
  } else {
    favs.add(n);
    btn.textContent = '★'; btn.classList.add('active');
    btn.title = 'Remove from favorites';
    row.dataset.fav = '1'; row.classList.add('fav-row');
  }
  saveFavs();
  if (activeStatus === 'fav') refilter();
});

// ── Playlist drawer ──
function renderPlDrawer() {
  const list = document.getElementById('pl-list');
  const filterRow = document.getElementById('pl-filter-row');
  const names = Object.keys(playlists);
  if (!names.length) {
    list.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:12px">No playlists yet. Create one below.</p>';
    filterRow.style.display = 'none';
    return;
  }
  list.innerHTML = names.map(name => {
    const ct = (playlists[name]||[]).length;
    const active = activePl === name ? ' active-pl' : '';
    return `<div class="pl-item${active}" data-pl="${name}">
      <span>${name}</span><span class="pl-ct">${ct}</span>
      <button class="pl-item-del" data-del="${name}" title="Delete playlist">✕</button>
    </div>`;
  }).join('');

  // filter pills row
  filterRow.style.display = 'flex';
  filterRow.innerHTML = '<span style="font-size:12px;color:var(--muted);white-space:nowrap">Playlist:</span>' +
    names.map(name =>
      `<button class="pl-filter-pill${activePl===name?' on':''}" data-plf="${name}">${name} (${(playlists[name]||[]).length})</button>`
    ).join('') +
    (activePl ? '<button class="pl-filter-pill" data-plf="">Clear</button>' : '');
}

document.getElementById('pl-open').addEventListener('click', () => {
  document.getElementById('pl-drawer').classList.add('open');
  renderPlDrawer();
});
document.getElementById('pl-close').addEventListener('click', () => {
  document.getElementById('pl-drawer').classList.remove('open');
});

document.getElementById('pl-list').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const name = del.dataset.del;
    if (!confirm(`Delete playlist "${name}"?`)) return;
    delete playlists[name];
    if (activePl === name) { activePl = null; refilter(); }
    savePlaylists(); renderPlDrawer(); return;
  }
  const item = e.target.closest('.pl-item');
  if (item) {
    const name = item.dataset.pl;
    activePl = activePl === name ? null : name;
    renderPlDrawer(); refilter();
  }
});

document.getElementById('pl-filter-row').addEventListener('click', e => {
  const btn = e.target.closest('[data-plf]');
  if (!btn) return;
  activePl = btn.dataset.plf || null;
  renderPlDrawer(); refilter();
});

document.getElementById('pl-create-btn').addEventListener('click', () => {
  const inp = document.getElementById('pl-new-name');
  const name = inp.value.trim();
  if (!name) return;
  if (playlists[name]) { inp.select(); return; }
  playlists[name] = [];
  savePlaylists(); inp.value = ''; renderPlDrawer();
});
document.getElementById('pl-new-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pl-create-btn').click();
});

// ── Add-to-playlist popup ──
let popupTargetN = null;
const popup = document.getElementById('pl-popup');

document.addEventListener('click', e => {
  const btn = e.target.closest('.pl-btn');
  if (btn) {
    e.stopPropagation();
    popupTargetN = +btn.dataset.n;
    const names = Object.keys(playlists);
    const body = document.getElementById('pl-popup-body');
    if (!names.length) {
      body.innerHTML = '<div class="pl-popup-item" style="color:var(--muted)">No playlists yet — open 📋 to create one</div>';
    } else {
      body.innerHTML = names.map(name => {
        const has = (playlists[name]||[]).includes(popupTargetN);
        return `<div class="pl-popup-item${has?' already':''}" data-add="${name}">${has?'✓ ':''} ${name}</div>`;
      }).join('');
    }
    const r = btn.getBoundingClientRect();
    popup.style.top  = `${Math.min(r.bottom + 4, window.innerHeight - 160)}px`;
    popup.style.left = `${Math.max(4, r.left - 170)}px`;
    popup.classList.add('open');
    return;
  }
  if (!popup.contains(e.target)) popup.classList.remove('open');
});

document.getElementById('pl-popup-body').addEventListener('click', e => {
  const item = e.target.closest('[data-add]');
  if (!item || popupTargetN == null) return;
  const name = item.dataset.add;
  if (!playlists[name]) playlists[name] = [];
  const idx = playlists[name].indexOf(popupTargetN);
  if (idx >= 0) playlists[name].splice(idx, 1);
  else playlists[name].push(popupTargetN);
  savePlaylists(); renderPlDrawer(); popup.classList.remove('open');
  if (activePl === name) refilter();
});

refilter();
renderPlDrawer();

// ── Notebook Viewer ──
const NB_RAW = 'https://raw.githubusercontent.com/sanjay-bhat/ProgrammingConcepts/main/leetcode/';
let nbData = {}, activeNbTab = 'csharp';

function getCellSrc(cell) {
  if (!cell) return '';
  const s = cell.source || cell.input || [];
  return Array.isArray(s) ? s.join('') : String(s);
}

function renderMd(md) {
  const html = typeof marked !== 'undefined'
    ? marked.parse(md || '')
    : `<pre style="white-space:pre-wrap">${(md||'').replace(/</g,'&lt;')}</pre>`;
  return `<div class="nb-md">${html}</div>`;
}

function renderCode(src, lang) {
  const pLang = { csharp:'csharp', python:'python', go:'go', rust:'rust' }[lang] || 'csharp';
  const label = { csharp:'C#', python:'Python', go:'Go', rust:'Rust' }[lang] || lang;
  let hi = (src||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (typeof Prism !== 'undefined' && Prism.languages[pLang]) {
    hi = Prism.highlight(src || '', Prism.languages[pLang], pLang);
  }
  return `<div class="nb-code-wrap"><span class="nb-code-lang">${label}</span><pre class="nb-code language-${pLang}"><code>${hi}</code></pre></div>`;
}

function showNbTab(tab) {
  activeNbTab = tab;
  document.querySelectorAll('.nb-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const body = document.getElementById('nb-body');
  if (tab === 'overview' || tab === 'examples') {
    body.innerHTML = renderMd(nbData[tab]);
  } else {
    const src = (nbData[tab]||'').trim();
    body.innerHTML = src ? renderCode(src, tab) : `<div class="nb-error">No ${tab} solution in this notebook.</div>`;
  }
}

async function openNotebook(p) {
  const overlay = document.getElementById('nb-overlay');
  const body    = document.getElementById('nb-body');
  const file    = String(p.n).padStart(4,'0');
  const ghUrl   = `${ghBase}${file}.ipynb`;

  document.getElementById('nb-num').textContent = `#${p.n}`;
  document.getElementById('nb-title').textContent = p.t;
  const badge = document.getElementById('nb-badge');
  badge.textContent = p.d.charAt(0).toUpperCase() + p.d.slice(1);
  badge.className = 'nb-badge b' + p.d[0];
  document.getElementById('nb-gh-link').href = ghUrl;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  body.innerHTML = '<div class="nb-loading">Loading notebook…</div>';
  document.querySelectorAll('.nb-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'csharp'));

  try {
    const res = await fetch(`${NB_RAW}${file}.ipynb`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const nb = await res.json();
    const cells = nb.cells || (nb.worksheets?.[0]?.cells) || [];
    nbData = {
      overview: getCellSrc(cells[0]),
      csharp:   getCellSrc(cells[2]),
      python:   getCellSrc(cells[4]),
      go:       getCellSrc(cells[6]),
      rust:     getCellSrc(cells[8]),
      examples: getCellSrc(cells[9])
    };
    showNbTab('csharp');
  } catch {
    body.innerHTML = `<div class="nb-error">
      <p>Could not load inline — please open the tracker directly in your browser (not as a preview).</p>
      <p style="margin-top:14px"><a href="${ghUrl}" target="_blank" rel="noopener">View on GitHub ↗</a></p>
    </div>`;
  }
}

function closeNotebook() {
  document.getElementById('nb-overlay').classList.remove('open');
  document.body.style.overflow = '';
  nbData = {};
}

document.getElementById('nb-close').addEventListener('click', closeNotebook);
document.getElementById('nb-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('nb-overlay')) closeNotebook();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('nb-overlay').classList.contains('open')) closeNotebook();
});
document.getElementById('nb-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.nb-tab');
  if (tab && nbData.csharp !== undefined) showNbTab(tab.dataset.tab);
});
// Intercept solved-link clicks
document.addEventListener('click', e => {
  const link = e.target.closest('a.plink:not(.unsolved)');
  if (!link || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  const row = link.closest('tr');
  if (!row) return;
  const prob = P.find(x => x.n === +row.dataset.n && x.s);
  if (prob) openNotebook(prob);
}, true);

// ── Bulk Select + PDF Export ──
let selectMode = false;
const selectedNs = new Set();

// inject select bar + select toggle button
document.querySelector('.filter-bar h1').insertAdjacentHTML('afterend',
  `<button id="sel-toggle" style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .1s">☑ Select</button>`
);

const selBar = document.createElement('div');
selBar.id = 'sel-bar';
selBar.style.cssText = 'display:none;align-items:center;gap:10px;padding:7px 18px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;position:sticky;top:0;z-index:50;';
selBar.innerHTML = `<span id="sel-count" style="font-weight:600;color:var(--accent)">0 selected</span>
  <button id="sel-all" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;text-decoration:underline;padding:0">Select visible solved</button>
  <button id="sel-none" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;text-decoration:underline;padding:0">Clear</button>
  <button id="sel-pdf" style="margin-left:auto;background:var(--accent);color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;">⬇ Export PDF</button>`;
document.querySelector('.stats-strip').before(selBar);

// hidden print section
const printSec = document.createElement('div');
printSec.id = 'print-sec';
printSec.style.display = 'none';
document.body.appendChild(printSec);

// print CSS
const printStyle = document.createElement('style');
printStyle.textContent = `
@media print {
  .filter-bar,.stats-strip,.content,.nb-overlay,.pl-drawer,.pl-popup,#sel-bar,#pl-filter-row,.empty,#sel-toggle,.pl-open-btn { display:none!important; }
  #print-sec { display:block!important; }
}
.print-nb { page-break-after:always; padding:24px 32px; font-family:system-ui,sans-serif; }
.print-nb:last-child { page-break-after:auto; }
.print-nb h1 { font-size:20px; margin:0 0 4px; }
.print-nb .print-meta { font-size:12px; color:#555; margin-bottom:16px; }
.print-nb pre { background:#f5f5f5; padding:14px; border-radius:6px; font-size:11px; line-height:1.5; overflow-x:auto; white-space:pre-wrap; word-break:break-all; margin:6px 0 14px; font-family:monospace; }
.print-nb h3 { font-size:13px; margin:12px 0 2px; }
.print-nb table { width:100%; border-collapse:collapse; font-size:11px; margin:8px 0; }
.print-nb th,.print-nb td { padding:4px 8px; border:1px solid #ddd; }
.print-nb th { background:#f0f0f0; }`;
document.head.appendChild(printStyle);

function updateSelUI() {
  document.getElementById('sel-count').textContent = `${selectedNs.size} selected`;
}

function toggleSelectMode(on) {
  selectMode = on;
  selectedNs.clear();
  document.getElementById('sel-toggle').style.background = on ? 'var(--accent)' : '';
  document.getElementById('sel-toggle').style.color = on ? '#fff' : '';
  document.getElementById('sel-toggle').style.borderColor = on ? 'var(--accent)' : '';
  selBar.style.display = on ? 'flex' : 'none';
  // add/remove checkboxes
  document.querySelectorAll('tbody tr').forEach(row => {
    const existing = row.querySelector('.sel-cb');
    if (on && !existing) {
      const isSolved = row.dataset.s === '1';
      const td = document.createElement('td');
      td.style.cssText = 'padding:4px 8px;width:28px;';
      if (isSolved) {
        td.innerHTML = `<input type="checkbox" class="sel-cb" data-n="${row.dataset.n}" style="cursor:pointer;accent-color:var(--accent)">`;
      }
      row.insertBefore(td, row.firstChild);
    } else if (!on && existing) {
      existing.closest('td')?.remove();
    }
  });
  // also add/remove blank th in all headers
  document.querySelectorAll('thead tr').forEach(row => {
    const existing = row.querySelector('.sel-th');
    if (on && !existing) {
      const th = document.createElement('th');
      th.className = 'sel-th'; th.style.width = '28px';
      row.insertBefore(th, row.firstChild);
    } else if (!on) row.querySelector('.sel-th')?.remove();
  });
  if (!on) updateSelUI();
}

document.getElementById('sel-toggle').addEventListener('click', () => toggleSelectMode(!selectMode));

document.addEventListener('change', e => {
  const cb = e.target.closest('.sel-cb');
  if (!cb) return;
  const n = +cb.dataset.n;
  cb.checked ? selectedNs.add(n) : selectedNs.delete(n);
  updateSelUI();
});

document.getElementById('sel-all').addEventListener('click', () => {
  document.querySelectorAll('.sel-cb:not([hidden])').forEach(cb => {
    const row = cb.closest('tr');
    if (!row || row.hidden) return;
    cb.checked = true; selectedNs.add(+cb.dataset.n);
  });
  updateSelUI();
});
document.getElementById('sel-none').addEventListener('click', () => {
  document.querySelectorAll('.sel-cb').forEach(cb => { cb.checked = false; });
  selectedNs.clear(); updateSelUI();
});

document.getElementById('sel-pdf').addEventListener('click', async () => {
  if (!selectedNs.size) { alert('Select at least one solved problem first.'); return; }
  const btn = document.getElementById('sel-pdf');
  btn.disabled = true;
  const total = selectedNs.size;
  let done = 0;

  const results = await Promise.allSettled([...selectedNs].map(async n => {
    const file = String(n).padStart(4,'0');
    const res = await fetch(`${NB_RAW}${file}.ipynb`);
    if (!res.ok) throw new Error('Not found');
    const nb = await res.json();
    const cells = nb.cells || (nb.worksheets?.[0]?.cells) || [];
    btn.textContent = `Loading ${++done}/${total}…`;
    return { n, cells };
  }));

  printSec.innerHTML = results.map((r, i) => {
    const n = [...selectedNs][i];
    const prob = P.find(x => x.n === n);
    if (r.status === 'rejected') return `<div class="print-nb"><h1>#${n} — Load failed</h1></div>`;
    const { cells } = r.value;
    const cs = getCellSrc(cells[2]), py = getCellSrc(cells[4]);
    const go = getCellSrc(cells[6]), rs = getCellSrc(cells[8]);
    const diff = prob ? prob.d.charAt(0).toUpperCase()+prob.d.slice(1) : '';
    return `<div class="print-nb">
      <h1>#${n}: ${prob?.t||''}</h1>
      <div class="print-meta">${diff} · <a href="https://leetcode.com/problems/">${prob?.ds||''}</a> · Time: O(${prob?.tc||'?'}) · Space: O(${prob?.sc||'?'})</div>
      ${getCellSrc(cells[0]).split('---')[0] ? `<div style="font-size:12px;margin-bottom:12px;white-space:pre-wrap">${getCellSrc(cells[0]).replace(/^#[^\n]*\n/,'').replace(/https?:\/\/[^\s]+/g,'').slice(0,800)}</div>` : ''}
      ${cs ? `<h3>C#</h3><pre>${cs.replace(/</g,'&lt;')}</pre>` : ''}
      ${py ? `<h3>Python</h3><pre>${py.replace(/</g,'&lt;')}</pre>` : ''}
      ${go ? `<h3>Go</h3><pre>${go.replace(/</g,'&lt;')}</pre>` : ''}
      ${rs ? `<h3>Rust</h3><pre>${rs.replace(/</g,'&lt;')}</pre>` : ''}
    </div>`;
  }).join('');

  btn.disabled = false;
  btn.textContent = '⬇ Export PDF';
  window.print();
  printSec.innerHTML = '';
});
</script>
