    const x = v[k];
    if (isSpec(x)) kids.push(x);
    else if (Array.isArray(x) && x.length && x.every(isSpec)) kids.push(...x);
  }
  let box = host;
  if (typeof v.title === "string" && kids.length === 1) { box = panel(v.title, v.note); host.appendChild(box); }
  if (!kids.length) { if (v.empty) box.appendChild(h("p", "empty", v.empty)); return; }
  const row = h("div", "rowv"); box.appendChild(row);
  kids.forEach((kid, i) => {
    const cell = h("div");
    if (Array.isArray(v.titles) && v.titles[i]) cell.appendChild(h("p", "viewtitle", v.titles[i]));
    row.appendChild(cell);
    renderAny(kid, cell, `${slot}.${i}`);
  });
}

// ------------------------------------------------------------ player
let sc = 0, idx = 0, prev = -1, playing = false, speed = 1, timer = null;
const frames = () => DATA.scenarios[sc].frames;

function render(i, smooth) {
  const f = frames()[i];
  forward = smooth && i === prev + 1;
  smoothNext = !!smooth;
  curKeys = new Map();
  const main = $("main"), side = $("side");
  main.replaceChildren(); side.replaceChildren();
  $("stage").classList.toggle("solo", !f.side);
  f.main.forEach((v, k) => { const host = h("div"); main.appendChild(host); renderAny(v, host, `m${k}`); });
  if (f.side) renderAny(f.side, side, "side");
  prevKeys = curKeys;
  requestAnimationFrame(() => flipAll($("stage")));

  const cbox = $("counters");
  const ckeys = Object.keys(f.counters || {});
  if (cbox.dataset.sig !== ckeys.join("|")) {
    cbox.replaceChildren(); cbox.dataset.sig = ckeys.join("|");
    ckeys.forEach((k) => { const p = h("div", "pill"); p.appendChild(h("span", "", k)); const b = h("b"); b.dataset.k = k; p.appendChild(b); cbox.appendChild(p); });
  }
  cbox.querySelectorAll("b").forEach((b) => {
    const val = String(f.counters[b.dataset.k]);
    if (b.textContent !== val) { const was = b.textContent; b.textContent = val; if (forward && was !== "") anim(b, { scale: [1, 1.45, 1] }, { duration: 0.45 }); }
  });

  const lg = $("legend"); lg.replaceChildren();
  (f.legend || []).forEach(([c, t]) => { const li = h("li"); const sw = h("span", "swatch"); sw.style.boxShadow = `inset 0 0 0 3px ${col(c)}`; li.appendChild(sw); li.appendChild(document.createTextNode(t)); lg.appendChild(li); });

  $("sayKey").hidden = f.hold < KEY_HOLD;
  $("say1").textContent = f.caption;
  $("say2").textContent = f.sub || "";
  if (smooth) anim($("say"), { opacity: [0.4, 1], y: [5, 0] }, { duration: 0.25 });

  const scrub = $("scrub");
  scrub.value = i;
  $("where").textContent = `Step ${i + 1} of ${frames().length}`;
  $("btnBack").disabled = i === 0;
  $("btnNext").disabled = i === frames().length - 1;
  if (!playing) $("btnPlay").textContent = i === frames().length - 1 ? "↻ Replay" : "▶ Play";
  prev = i;
}

function go(i, smooth = true) {
  idx = Math.max(0, Math.min(frames().length - 1, i));
  render(idx, smooth);
  if (playing) schedule();
}
function schedule() {
  clearTimeout(timer);
  if (idx >= frames().length - 1) { setPlaying(false); return; }
  timer = setTimeout(() => { idx += 1; render(idx, true); schedule(); }, (frames()[idx].hold * 1000) / speed);
}
function setPlaying(on) {
  playing = on;
  if (on && idx >= frames().length - 1) { idx = 0; prev = -1; lastRects = new Map(); prevKeys = new Map(); render(0, false); }
  $("btnPlay").textContent = on ? "❚❚ Pause" : idx >= frames().length - 1 ? "↻ Replay" : "▶ Play";
  if (on) schedule(); else clearTimeout(timer);
}

function selectScenario(k) {
  setPlaying(false);
  sc = k; idx = 0; prev = -1; lastRects = new Map(); prevKeys = new Map();
  document.querySelectorAll("#tabs button").forEach((b, j) => b.setAttribute("aria-selected", String(j === k)));
  $("blurb").textContent = DATA.scenarios[k].blurb;
  $("subtitle").textContent = DATA.scenarios[k].subtitle || DATA.subtitle;
  const scrub = $("scrub"); scrub.max = frames().length - 1;
  const ticks = $("ticks"); ticks.replaceChildren();
  const n = frames().length;
  frames().forEach((f, i) => {
    if (f.hold < KEY_HOLD || n < 2) return;
    const b = h("button"); b.type = "button"; b.title = f.caption;
    b.setAttribute("aria-label", `Jump to step ${i + 1}: ${f.caption}`);
    b.style.left = `calc(${(i / (n - 1)) * 100}% + ${(0.5 - i / (n - 1)) * 16}px)`;
    b.onclick = () => go(i, false);
    ticks.appendChild(b);
  });
  render(0, false);
}

// ------------------------------------------------------------ boot
$("kicker").textContent = `LeetCode #${DATA.num} · interactive walkthrough`;
$("title").textContent = DATA.title.replace(/^#\d+\s*/, "");
document.title = `#${DATA.num} ${DATA.title.replace(/^#\d+\s*/, "").split(":")[0]} Walkthrough`;
DATA.scenarios.forEach((scn, k) => {
  const b = h("button", "", scn.name); b.type = "button"; b.setAttribute("role", "tab");
  b.onclick = () => selectScenario(k);
  $("tabs").appendChild(b);
});
if (DATA.scenarios.length < 2) $("tabs").hidden = true;

$("btnPlay").onclick = () => setPlaying(!playing);
$("btnNext").onclick = () => go(idx + 1);
$("btnBack").onclick = () => go(idx - 1);
$("btnRestart").onclick = () => { setPlaying(false); prev = -1; go(0, false); };
$("scrub").oninput = (e) => go(+e.target.value, false);
document.querySelectorAll(".speed button").forEach((b) => b.onclick = () => {
  speed = +b.dataset.speed;
  document.querySelectorAll(".speed button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  if (playing) schedule();
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.closest && ev.target.closest("input, textarea, button")) { if (ev.key === " ") return; }
  if (ev.key === " ") { ev.preventDefault(); setPlaying(!playing); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); go(idx + 1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); go(idx - 1); }
});
let rz = null;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => render(idx, false), 120); });
selectScenario(0);
if (document.fonts) document.fonts.ready.then(() => render(idx, false));
</script>
</body>
</html>
